services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro
      MARIADB_USER: usercompro_2388010047
      MARIADB_PASSWORD: 12345
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/dbcompro.sql:/docker-entrypoint-initdb.d/dbcompro.sql
    restart: always

  container-statis:
    image: ${DOCKERHUB_USERNAME}/compro_2388010047:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: ${DOCKERHUB_USERNAME}/compro_2388010047:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_HOST: db-webdinamis
      DB_USER: usercompro_2388010047
      DB_PASSWORD: 12345
      DB_NAME: dbcompro
      NEXTAUTH_URL: http://13.238.128.212:3000
      NEXTAUTH_SECRET: superrahasiabanget12345678901234
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}