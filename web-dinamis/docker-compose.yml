services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro
      MARIADB_USER: userwebdinamis_2388010047
      MARIADB_PASSWORD: 12345
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/dbcompro.sql:/docker-entrypoint-initdb.d/dbcompro.sql
    restart: always

  container-statis:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010047:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010047:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_HOST: db-webdinamis
      DB_USER: userwebdinamis_2388010047
      DB_PASSWORD: 12345
      DB_NAME: dbcompro
    depends_on:
      - db-webdinamis  

volumes:
  db_data: {}
